<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة الحلقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5;
  --card:#ffffff;
  --text:#1d2b26;
  --muted:#6b7a74;
  --line:#e2e8e5;
  --primary:#1f7a5c;
  --primary-soft:#e3f2ec;
  --accent:#c98a1b;
  --accent-soft:#fbf1df;
  --frost:#eaf1f4;
  --frost-text:#8a9aa2;
  --danger:#c0392b;
  --wa:#25D366;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816;
    --card:#1b2420;
    --text:#e8efec;
    --muted:#93a39c;
    --line:#2b3632;
    --primary:#3fb68b;
    --primary-soft:#1e3a30;
    --accent:#e2a944;
    --accent-soft:#3a2f1c;
    --frost:#18201f;
    --frost-text:#6f807a;
    --danger:#e06656;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Tajawal",system-ui,sans-serif;font-size:16px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* رأس الصفحة */
.head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.head h1{flex:1;margin:0;font-size:1.5rem;font-weight:800;line-height:1.3;word-break:break-word}
.icon-btn{
  border:1px solid var(--line);background:var(--card);border-radius:10px;
  width:40px;height:40px;display:grid;place-items:center;flex-shrink:0;padding:0;
}

/* التاريخ */
.date-bar{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px;
}
.date-mid{flex:1;text-align:center;position:relative}
.date-mid .day{font-weight:700;font-size:1.05rem}
.date-mid .sub{color:var(--muted);font-size:.85rem}
.date-mid input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.today-link{border:0;background:none;color:var(--primary);font-size:.8rem;padding:0;text-decoration:underline}

/* أزرار الكل */
.bulk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.bulk button{border:0;border-radius:12px;padding:12px 8px;font-weight:700}
.bulk .b-att{background:var(--primary-soft);color:var(--primary)}
.bulk .b-done{background:var(--accent-soft);color:var(--accent)}

/* شريط القائمة */
.list-bar{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}
.list-bar .stats{color:var(--muted);font-size:.9rem}
.list-bar .stats b{color:var(--text)}
.sort-btn{
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;
  font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px;
}

/* الأقسام */
.sec{margin:14px 2px 6px;font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sec .hint{font-weight:500}
.cards{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}

/* البطاقة الفعّالة */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:box-shadow .15s,border-color .15s}
.card .top{display:flex;align-items:center;gap:8px}
.card .name{flex:1;font-weight:700;word-break:break-word;min-width:0}
.card .bot{display:flex;align-items:center;gap:8px;margin-top:10px}
.handle{
  width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:8px;
  touch-action:none;cursor:grab;flex-shrink:0;user-select:none;-webkit-user-select:none;
}
.finish{
  border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
  border-radius:10px;height:34px;padding:0 10px;display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;flex-shrink:0;
}
.finish svg{width:16px;height:16px}
.timer{
  border:1px solid var(--line);background:var(--bg);border-radius:10px;height:38px;padding:0 10px;
  display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;min-width:96px;justify-content:center;
}
.timer.run{background:var(--primary);border-color:var(--primary);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer;margin-inline-start:auto}
.chk + .chk{margin-inline-start:4px}
.chk input{
  appearance:none;-webkit-appearance:none;width:30px;height:30px;margin:0;cursor:pointer;
  border:2px solid var(--line);border-radius:8px;background:var(--bg);display:grid;place-items:center;
  transition:background .12s,border-color .12s;
}
.chk input::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.chk input:checked::after{opacity:1}
.chk.att input:checked{background:var(--primary);border-color:var(--primary)}
.chk.done input:checked{background:var(--accent);border-color:var(--accent)}

/* التسميع المشترك */
.group{border:2px solid var(--primary);background:linear-gradient(var(--primary-soft),var(--card) 60px)}
.group .tag{flex:1;font-size:.85rem;font-weight:800;color:var(--primary)}
.ungroup{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;padding:0 10px;font-size:.8rem;font-weight:700}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.mrow:first-of-type{margin-top:6px}
.mrow .name{flex:1;font-weight:700}
.mrow .chk{margin-inline-start:0}

/* السحب والدمج */
.card.dragging{opacity:.35}
.card.drop-target{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.2);transform:rotate(-1.5deg);margin:0}

/* البطاقة المجمّدة */
.frozen{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  background:var(--frost);color:var(--frost-text);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;
}
.frozen .ic{width:22px;text-align:center;flex-shrink:0;opacity:.8}
.frozen .name{flex:1;font-weight:500}
.frozen.fin{border-style:solid}
.frozen.fin .ic{color:var(--accent);opacity:1}
.frozen .meta{font-size:.8rem;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.frozen:active{transform:scale(.99)}

/* الإضافة */
.add{display:flex;gap:8px;margin-top:16px}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.add button{border:0;border-radius:12px;padding:0 18px;background:var(--primary);color:#fff;font-weight:700}

/* وضع التعديل */
.erow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.erow input{flex:1;min-width:0;border:1px solid var(--primary);border-radius:8px;padding:8px;background:var(--bg)}
.erow .del{border:1px solid var(--line);background:var(--bg);color:var(--danger);border-radius:8px;width:36px;height:36px}
.editing .bulk,.editing .list-bar{display:none}

/* واتساب */
.export{
  position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.export button{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:608px;margin:0 auto;
  border:0;border-radius:14px;padding:14px;background:var(--wa);color:#fff;font-weight:800;font-size:1.05rem;
  box-shadow:0 4px 14px rgba(37,211,102,.35);
}
.export svg{width:26px;height:26px}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;
  transition:.2s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* شاشة البداية */
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:40px;text-align:center}
.setup h2{margin:0 0 6px}
.setup p{color:var(--muted);margin:0 0 16px}
.setup input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-bottom:12px;text-align:center}
.setup button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--primary);color:#fff;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- شاشة البداية: تسجيل اسم الحلقة -->
  <section class="setup" id="setup" hidden>
    <h2>أهلًا بك</h2>
    <p>ابدأ بتسجيل اسم الحلقة</p>
    <form id="setupForm">
      <input id="setupName" placeholder="مثال: حلقة الفجر" required autocomplete="off">
      <button type="submit">حفظ والمتابعة</button>
    </form>
  </section>

  <!-- الشاشة الرئيسية -->
  <main id="main" hidden>
    <div class="head">
      <h1 id="title"></h1>
      <button class="icon-btn" id="editBtn"></button>
    </div>

    <div class="date-bar">
      <button class="icon-btn" id="prevDay" aria-label="اليوم السابق">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <div class="date-mid">
        <div class="day" id="dayName"></div>
        <div class="sub" id="dayDate"></div>
        <input type="date" id="datePick" aria-label="اختيار التاريخ">
      </div>
      <button class="icon-btn" id="nextDay" aria-label="اليوم التالي">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div style="text-align:center;margin:-4px 0 12px" id="todayWrap" hidden>
      <button class="today-link" id="goToday">العودة إلى اليوم</button>
    </div>

    <div class="bulk">
      <button class="b-att" id="allAtt">تحضير الجميع</button>
      <button class="b-done" id="allDone">إنجاز الجميع</button>
    </div>

    <div class="list-bar">
      <span class="stats" id="stats"></span>
      <button class="sort-btn" id="sortBtn"></button>
    </div>

    <div id="rows"></div>

    <form class="add" id="addForm">
      <input id="addName" placeholder="اسم طالب جديد" autocomplete="off" required>
      <button type="submit">إضافة</button>
    </form>
  </main>
</div>

<div class="export" id="exportBar" hidden>
  <button id="exportBtn">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.23-9.43 9.44-9.43 2.52 0 4.89.98 6.67 2.77a9.37 9.37 0 0 1 2.76 6.67c0 5.2-4.23 9.43-9.44 9.43m8.03-17.46A11.27 11.27 0 0 0 12.05.72C5.8.72.71 5.8.7 12.06c0 2 .52 3.95 1.52 5.67L.6 23.28l5.69-1.49a11.34 11.34 0 0 0 5.75 1.47h.01c6.26 0 11.35-5.09 11.35-11.34 0-3.03-1.18-5.88-3.32-8.02"/></svg>
    تصدير إلى واتساب
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'halaqa-tracker-v1';
const $ = id => document.getElementById(id);

const ICON_EDIT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const ICON_OK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
const ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>';
const ICON_PAUSE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const ICON_GRIP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>';

/*
  البيانات:
  { name, desc, students:[{id,name}],
    records:{ 'YYYY-MM-DD': {
      s:{ id:{ a:حضر, d:أنجز, st:'idle'|'active'|'done', g:رقم المجموعة, acc:ms, t0:بداية التشغيل, p:[شركاء التسميع] } },
      g:{ gid:{ acc, t0 } } } } }
  st: idle = مجمّدة لم تُفعَّل، active = في الحلقة الآن، done = أنهى وأُعيد تجميدها
*/
let data = load();
let currentDate = todayStr();
let editing = false;

function load(){
  let d;
  try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d = d || {name:'',students:[],records:{}};
  // ترحيل سجلات النسخة الأولى { id:{a,d} }
  Object.keys(d.records).forEach(k => {
    if(!d.records[k].s) d.records[k] = {s:d.records[k], g:{}};
  });
  return d;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ toast('تعذّر الحفظ على الجهاز'); }
}

// التاريخ بالتوقيت المحلي
function pad(n){ return String(n).padStart(2,'0'); }
function toStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return toStr(new Date()); }
function shiftDay(n){ const d = fromStr(currentDate); d.setDate(d.getDate()+n); currentDate = toStr(d); render(); }
function dayName(s){ return fromStr(s).toLocaleDateString('ar',{weekday:'long'}); }
function fmtDate(s){ const d = fromStr(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }

// سجلات اليوم
function day(){ return data.records[currentDate] || {s:{},g:{}}; }
function dayW(){ return data.records[currentDate] || (data.records[currentDate] = {s:{},g:{}}); }
function norm(r){
  return Object.assign({a:false,d:false,st:'idle',g:null,acc:0,t0:null,p:[]}, {st:r && r.a ? 'active' : 'idle'}, r);
}
function rec(id){ return norm(day().s[id]); }
function recW(id){ const d = dayW(); return d.s[id] = norm(d.s[id]); }

// المؤقت
function elapsed(t){ return t.acc + (t.t0 ? Date.now() - t.t0 : 0); }
function stop(t){ if(t.t0){ t.acc += Date.now() - t.t0; t.t0 = null; } }
function studentTime(id){
  const d = day(), r = rec(id);
  return elapsed(r) + (r.g && d.g[r.g] ? elapsed(d.g[r.g]) : 0);
}
function fmtTime(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600);
  return (h ? h+':'+pad(Math.floor(s/60)%60) : pad(Math.floor(s/60))) + ':' + pad(s%60);
}
function timerOf(key){
  const [k,id] = key.split(':');
  return k === 'g' ? dayW().g[id] : recW(id);
}

// المجموعات (التسميع المشترك)
function members(gid){ return data.students.filter(s => (day().s[s.id]||{}).g === gid); }
function dissolve(gid){
  const d = dayW(), G = d.g[gid];
  if(!G) return [];
  stop(G);
  const ms = members(gid);
  ms.forEach(s => { const r = recW(s.id); r.acc += G.acc; r.g = null; });
  delete d.g[gid];
  return ms;
}
function leaveGroup(id){
  const d = dayW(), r = recW(id), G = d.g[r.g];
  if(!G) return;
  const gid = r.g;
  r.acc += elapsed(G); r.g = null;
  if(members(gid).length < 2) dissolve(gid);
}
function merge(srcId, targetKey){
  const d = dayW(), src = recW(srcId);
  const [k,tid] = targetKey.split(':');
  let gid;
  if(k === 'g'){ gid = tid; }
  else{
    const t = recW(tid);
    if(t.g){ gid = t.g; }
    else{
      gid = 'g' + Date.now().toString(36);
      d.g[gid] = {acc:0,t0:null};
      stop(t); t.g = gid;
    }
  }
  stop(src); src.g = gid;
  // حفظ الشركاء لعرضهم في التقرير
  const ids = members(gid).map(s => s.id);
  ids.forEach(id => {
    const r = recW(id);
    r.p = [...new Set([...r.p, ...ids.filter(x => x !== id)])];
  });
  save(); render();
}

// الحالات
function activate(id){ const r = recW(id); r.st = 'active'; r.a = true; }
function finishStudent(id){ const r = recW(id); stop(r); r.st = 'done'; r.a = true; r.d = true; }
function setAttendance(id, val){
  const r = recW(id);
  r.a = val;
  if(val){ if(r.st === 'idle') r.st = 'active'; return; }
  if(r.g) leaveGroup(id);
  stop(r); r.st = 'idle';
}

// الترتيب
function cmp(a,b){ return a.name.localeCompare(b.name,'ar') * (data.desc ? -1 : 1); }
function sorted(){ return [...data.students].sort(cmp); }

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function timerBtn(key, ms, running){
  return '<button class="timer'+(running?' run':'')+'" data-timer="'+key+'">'
    + (running?ICON_PAUSE:ICON_PLAY)+'<span data-tkey="'+key+'">'+fmtTime(ms)+'</span></button>';
}
function checks(id, r){
  return '<label class="chk att"><input type="checkbox" data-f="a" data-id="'+id+'" '+(r.a?'checked':'')+'>حضور</label>'
    + '<label class="chk done"><input type="checkbox" data-f="d" data-id="'+id+'" '+(r.d?'checked':'')+'>إنجاز</label>';
}
function finishBtn(key){ return '<button class="finish" data-finish="'+key+'" title="أنهى — تجميد البطاقة">'+ICON_STAR+'أنهى</button>'; }

function render(){
  const hasName = !!data.name;
  $('setup').hidden = hasName;
  $('main').hidden = !hasName;
  $('exportBar').hidden = !hasName || editing;
  if(!hasName){ $('setupName').focus(); return; }

  document.body.classList.toggle('editing', editing);
  $('title').innerHTML = editing
    ? '<input id="titleInput" value="'+esc(data.name)+'" style="width:100%;font:inherit;border:1px solid var(--primary);border-radius:10px;padding:4px 8px;background:var(--card)">'
    : esc(data.name);
  $('editBtn').innerHTML = editing ? ICON_OK : ICON_EDIT;
  $('editBtn').title = editing ? 'حفظ التعديلات' : 'تعديل الحلقة والطلاب';

  $('dayName').textContent = dayName(currentDate);
  $('dayDate').textContent = fmtDate(currentDate);
  $('datePick').value = currentDate;
  $('todayWrap').hidden = currentDate === todayStr();
  $('sortBtn').innerHTML = data.desc ? 'ترتيب تنازلي (ي–أ)' : 'ترتيب تصاعدي (أ–ي)';

  const rows = $('rows');
  const list = sorted();
  if(!list.length){
    rows.innerHTML = '<div class="empty">لا يوجد طلاب بعد — أضف أول طالب من الأسفل</div>';
    renderStats(); return;
  }
  if(editing){
    rows.innerHTML = '<div class="cards">' + list.map(s =>
      '<div class="erow" data-id="'+s.id+'"><input value="'+esc(s.name)+'" data-rename="'+s.id+'">'
      + '<button class="del" data-del aria-label="حذف">✕</button></div>').join('') + '</div>';
    renderStats(); return;
  }

  const d = day();
  const active = [], idle = [], done = [];
  const seen = {};
  list.forEach(s => {
    const r = rec(s.id);
    if(r.st === 'idle') idle.push(s);
    else if(r.st === 'done') done.push(s);
    else if(r.g && d.g[r.g]){
      if(!seen[r.g]){ seen[r.g] = true; active.push({g:r.g, ms:list.filter(x => rec(x.id).g === r.g)}); }
    }
    else active.push(s);
  });

  let html = '';
  if(active.length){
    const singles = active.filter(u => !u.g).length;
    html += '<div class="sec"><span>في الحلقة الآن ('+active.reduce((n,u)=>n+(u.g?u.ms.length:1),0)+')</span>'
      + (singles >= 2 || (singles && active.length > 1) ? '<span class="hint">اسحب ⠿ فوق طالب آخر للتسميع المشترك</span>' : '') + '</div>';
    html += '<div class="cards">' + active.map(u => {
      if(u.g){
        const G = d.g[u.g];
        return '<div class="card group" data-drop="g:'+u.g+'">'
          + '<div class="top"><span class="tag">🤝 تسميع مشترك</span>'
          + '<button class="ungroup" data-ungroup="'+u.g+'">فصل</button>'+finishBtn('g:'+u.g)+'</div>'
          + u.ms.map(s => '<div class="mrow"><span class="name">'+esc(s.name)+'</span>'+checks(s.id, rec(s.id))+'</div>').join('')
          + '<div class="bot">'+timerBtn('g:'+u.g, elapsed(G), !!G.t0)+'</div></div>';
      }
      const r = rec(u.id);
      return '<div class="card" data-drop="s:'+u.id+'" data-id="'+u.id+'">'
        + '<div class="top"><span class="handle" aria-label="اسحب للدمج">'+ICON_GRIP+'</span>'
        + '<span class="name">'+esc(u.name)+'</span>'+finishBtn('s:'+u.id)+'</div>'
        + '<div class="bot">'+timerBtn('s:'+u.id, elapsed(r), !!r.t0)+checks(u.id, r)+'</div></div>';
    }).join('') + '</div>';
  }
  if(idle.length){
    html += '<div class="sec"><span>لم يُفعَّلوا بعد ('+idle.length+')</span><span class="hint">اضغط على الاسم للتفعيل</span></div>';
    html += '<div class="cards">' + idle.map(s =>
      '<button class="frozen" data-act="'+s.id+'"><span class="ic">❄</span><span class="name">'+esc(s.name)+'</span></button>').join('') + '</div>';
  }
  if(done.length){
    html += '<div class="sec"><span>أنهوا ('+done.length+')</span></div>';
    html += '<div class="cards">' + done.map(s => {
      const r = rec(s.id), t = studentTime(s.id);
      return '<button class="frozen fin" data-act="'+s.id+'"><span class="ic">★</span><span class="name">'+esc(s.name)+'</span>'
        + '<span class="meta">'+(t >= 1000 ? '⏱ '+fmtTime(t) : '')+(r.d ? ' ✓' : '')+'</span></button>';
    }).join('') + '</div>';
  }
  rows.innerHTML = html;
  renderStats();
}

function counts(){
  let a=0,d=0;
  data.students.forEach(s => { const r = rec(s.id); if(r.a) a++; if(r.d) d++; });
  return {a,d,n:data.students.length};
}
function renderStats(){
  const c = counts();
  $('stats').innerHTML = c.n ? 'الحضور <b>'+c.a+'/'+c.n+'</b> · الإنجاز <b>'+c.d+'/'+c.n+'</b>' : '';
  $('allAtt').textContent = c.n && c.a===c.n ? 'إلغاء تحضير الجميع' : 'تحضير الجميع';
  $('allDone').textContent = c.a && data.students.every(s => !rec(s.id).a || rec(s.id).d) ? 'إلغاء إنجاز الجميع' : 'إنجاز الجميع';
}

// تحديث المؤقتات كل ثانية دون إعادة رسم الصفحة
setInterval(() => {
  document.querySelectorAll('[data-tkey]').forEach(el => {
    const [k,id] = el.dataset.tkey.split(':');
    const t = k === 'g' ? day().g[id] : rec(id);
    if(t && t.t0) el.textContent = fmtTime(elapsed(t));
  });
}, 1000);

function commitEdits(){
  const t = document.getElementById('titleInput');
  if(t && t.value.trim()) data.name = t.value.trim();
  document.querySelectorAll('[data-rename]').forEach(inp => {
    const s = data.students.find(x => x.id === inp.dataset.rename);
    if(s && inp.value.trim()) s.name = inp.value.trim();
  });
  save();
}

// نص واتساب
function buildText(){
  const lines = ['*'+data.name+'*', '📅 '+dayName(currentDate)+' '+fmtDate(currentDate), ''];
  sorted().forEach((s,i) => {
    const r = rec(s.id), t = studentTime(s.id);
    let line = (i+1)+'. '+s.name+' — '+(r.a?'✅ حاضر':'❌ غائب')+' | '+(r.d?'✅ أنجز':'❌ لم ينجز');
    if(t >= 1000) line += ' | ⏱ '+fmtTime(t);
    const partners = r.p.map(id => (data.students.find(x => x.id === id)||{}).name).filter(Boolean);
    if(partners.length) line += ' | 🤝 مع '+partners.join(' و');
    lines.push(line);
  });
  const c = counts();
  lines.push('', 'الحضور: '+c.a+'/'+c.n+' — الإنجاز: '+c.d+'/'+c.n);
  return lines.join('\n');
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// الأحداث
$('setupForm').addEventListener('submit', e => {
  e.preventDefault();
  data.name = $('setupName').value.trim();
  if(data.name){ save(); render(); }
});
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('addName').value.trim();
  if(!name) return;
  if(editing) commitEdits();
  data.students.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name});
  save(); $('addName').value = ''; render(); $('addName').focus();
});
$('rows').addEventListener('change', e => {
  const f = e.target.dataset.f; if(!f) return;
  const id = e.target.dataset.id;
  if(f === 'a') setAttendance(id, e.target.checked);
  else recW(id).d = e.target.checked;
  save(); render();
});
$('rows').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.act){ activate(b.dataset.act); }
  else if(b.dataset.finish){
    const [k,id] = b.dataset.finish.split(':');
    if(k === 'g') dissolve(id).forEach(s => finishStudent(s.id));
    else finishStudent(id);
  }
  else if(b.dataset.ungroup){ dissolve(b.dataset.ungroup); }
  else if(b.dataset.timer){
    const t = timerOf(b.dataset.timer);
    if(t.t0) stop(t); else t.t0 = Date.now();
  }
  else if(b.hasAttribute('data-del')){
    commitEdits();
    const id = b.closest('[data-id]').dataset.id;
    const idx = data.students.findIndex(s => s.id === id);
    if(!confirm('حذف الطالب "'+data.students[idx].name+'"؟')) return;
    const keep = currentDate;
    Object.keys(data.records).forEach(k => { currentDate = k; if(rec(id).g) leaveGroup(id); delete data.records[k].s[id]; });
    currentDate = keep;
    data.students.splice(idx,1);
  }
  else return;
  save(); render();
});

// السحب والدمج — يعمل باللمس والفأرة
let drag = null;
$('rows').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if(!h) return;
  e.preventDefault();
  const card = h.closest('.card'), box = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, {width:box.width+'px', left:box.left+'px', top:box.top+'px'});
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  h.setPointerCapture(e.pointerId);
  drag = {id:card.dataset.id, card, ghost, dx:e.clientX-box.left, dy:e.clientY-box.top, target:null};
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  drag.ghost.style.left = (e.clientX - drag.dx)+'px';
  drag.ghost.style.top = (e.clientY - drag.dy)+'px';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const t = el && el.closest('[data-drop]');
  const target = t && t !== drag.card ? t : null;
  if(target !== drag.target){
    if(drag.target) drag.target.classList.remove('drop-target');
    if(target) target.classList.add('drop-target');
    drag.target = target;
  }
  if(e.clientY < 70) window.scrollBy(0,-12);
  else if(e.clientY > innerHeight - 110) window.scrollBy(0,12);
});
function endDrag(){
  if(!drag) return;
  const {id, ghost, card, target} = drag;
  ghost.remove(); card.classList.remove('dragging');
  drag = null;
  if(target) merge(id, target.dataset.drop);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

$('editBtn').addEventListener('click', () => { if(editing) commitEdits(); editing = !editing; render(); });
$('sortBtn').addEventListener('click', () => { data.desc = !data.desc; save(); render(); });
$('prevDay').addEventListener('click', () => shiftDay(-1));
$('nextDay').addEventListener('click', () => shiftDay(1));
$('goToday').addEventListener('click', () => { currentDate = todayStr(); render(); });
$('datePick').addEventListener('change', e => { if(e.target.value){ currentDate = e.target.value; render(); } });
$('allAtt').addEventListener('click', () => {
  if(!data.students.length) return;
  const c = counts();
  data.students.forEach(s => {
    if(c.a === c.n) setAttendance(s.id, false);
    else if(!rec(s.id).a) activate(s.id);
  });
  save(); render();
});
$('allDone').addEventListener('click', () => {
  const present = data.students.filter(s => rec(s.id).a);
  if(!present.length){ toast('لا يوجد طلاب حاضرون'); return; }
  const val = !present.every(s => rec(s.id).d);
  present.forEach(s => { recW(s.id).d = val; });
  save(); render();
});
$('exportBtn').addEventListener('click', async () => {
  if(!data.students.length){ toast('أضف طلابًا أولًا'); return; }
  toast(await copyText(buildText()) ? 'تم النسخ — الصقه في واتساب' : 'تعذّر النسخ');
});

render();
</script>
</body>
</html>
